<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #080b18;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    #game {
        width: 420px;
        height: 650px;
        position: relative;
        overflow: hidden;
        border: 3px solid #555;
        border-radius: 15px;
        background: linear-gradient(#050816, #111936);
        box-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
    }

    /* Stars */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        animation: moveStar linear infinite;
    }

    @keyframes moveStar {
        from {
            transform: translateY(-20px);
        }
        to {
            transform: translateY(680px);
        }
    }

    #topBar {
        position: absolute;
        top: 12px;
        left: 15px;
        right: 15px;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        font-weight: bold;
    }

    #player {
    position: absolute;
    width: 60px;
    height: 70px;
    bottom: 25px;
    left: 180px;
    background: linear-gradient(#4ddcff, #0066ff);
    clip-path: polygon(
        50% 0%,
        70% 30%,
        100% 100%,
        70% 88%,
        50% 100%,
        30% 88%,
        0% 100%,
        30% 30%
    );
    filter: drop-shadow(0 0 12px #00bfff);
    z-index: 5;
}

.cockpit {
    position: absolute;
    width: 22px;
    height: 25px;
    background: #dffaff;
    border-radius: 50% 50% 40% 40%;
    left: 19px;
    top: 17px;
    box-shadow: 0 0 8px white;
}

.left-wing {
    position: absolute;
    width: 20px;
    height: 35px;
    background: #008cff;
    left: 0;
    bottom: 5px;
    transform: skewY(-20deg);
}

.right-wing {
    position: absolute;
    width: 20px;
    height: 35px;
    background: #008cff;
    right: 0;
    bottom: 5px;
    transform: skewY(20deg);
}

.engine {
    position: absolute;
    width: 12px;
    height: 20px;
    background: orange;
    left: 24px;
    bottom: -10px;
    border-radius: 50%;
    box-shadow: 0 0 15px orange;
}

    #player::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 18px;
        background: orange;
        left: 17px;
        bottom: -10px;
        box-shadow: 0 0 15px orange;
    }

    .enemy {
        position: absolute;
        width: 42px;
        height: 42px;
        background: #ff304f;
        border-radius: 50%;
        box-shadow: 0 0 15px #ff304f;
        z-index: 2;
    }

    .enemy::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        background: #ff9aa8;
        border-radius: 50%;
        left: 12px;
        top: 12px;
    }

    .bullet {
        position: absolute;
        width: 5px;
        height: 18px;
        background: #00ffcc;
        border-radius: 5px;
        box-shadow: 0 0 10px #00ffcc;
        z-index: 2;
    }

    #startScreen,
    #gameOver {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgba(3, 6, 20, 0.94);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #gameOver {
        display: none;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 10px;
        color: #00d9ff;
        text-shadow: 0 0 15px #00d9ff;
    }

    h2 {
        font-size: 32px;
        color: #ff405d;
        margin-bottom: 10px;
    }

    p {
        margin: 8px;
        color: #ccc;
    }

    button {
        margin-top: 25px;
        padding: 14px 35px;
        border: none;
        border-radius: 30px;
        background: #00aaff;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
    }

    button:hover {
        transform: scale(1.05);
    }

    #controls {
        position: absolute;
        bottom: 10px;
        left: 15px;
        right: 15px;
        text-align: center;
        color: #aaa;
        font-size: 13px;
        z-index: 5;
    }

    .power {
        position: absolute;
        width: 20px;
        height: 20px;
        background: #ffe600;
        border-radius: 50%;
        box-shadow: 0 0 15px #ffe600;
    }
</style>
</head>

<body>

<div id="game">

    <div id="topBar">
        <div>🚀 Score: <span id="score">0</span></div>
        <div>❤️ Lives: <span id="lives">3</span></div>
    </div>

    <div id="startScreen">
        <h1>SPACE SHOOTER</h1>
        <p>Destroy the enemies and survive!</p>
        <p>⬅️ ➡️ Move &nbsp; | &nbsp; SPACE Fire</p>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>Your Score: <strong id="finalScore">0</strong></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <div id="player"></div>

    <div id="controls">
        Keyboard: ← → to move &nbsp; | &nbsp; SPACE to shoot
    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const finalScore = document.getElementById("finalScore");

let playerX = 187;
let score = 0;
let lives = 3;

let bullets = [];
let enemies = [];
let powers = [];

let gameRunning = false;
let keys = {};

let enemyTimer;
let gameLoopTimer;


/* ---------------- STARS ---------------- */

for (let i = 0; i < 70; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 420 + "px";
    star.style.top = Math.random() * 650 + "px";
    star.style.animationDuration =
        (2 + Math.random() * 5) + "s";

    game.appendChild(star);
}


/* ---------------- KEYBOARD ---------------- */

document.addEventListener("keydown", function(e) {

    keys[e.key] = true;

    if (e.key === " ") {
        e.preventDefault();

        if (gameRunning) {
            shoot();
        }
    }
});

document.addEventListener("keyup", function(e) {
    keys[e.key] = false;
});


/* ---------------- START ---------------- */

function startGame() {

    document.getElementById("startScreen").style.display = "none";

    gameRunning = true;

    score = 0;
    lives = 3;

    playerX = 187;

    scoreElement.textContent = score;
    livesElement.textContent = lives;

    player.style.left = playerX + "px";

    enemyTimer = setInterval(createEnemy, 800);

    gameLoop();

}


/* ---------------- PLAYER ---------------- */

function movePlayer() {

    if (keys["ArrowLeft"]) {
        playerX -= 6;
    }

    if (keys["ArrowRight"]) {
        playerX += 6;
    }

    if (playerX < 5) {
        playerX = 5;
    }

    if (playerX > 370) {
        playerX = 370;
    }

    player.style.left = playerX + "px";
}


/* ---------------- SHOOT ---------------- */

function shoot() {

    const bullet = document.createElement("div");

    bullet.className = "bullet";

    bullet.style.left = (playerX + 20) + "px";
    bullet.style.top = "570px";

    game.appendChild(bullet);

    bullets.push({
        element: bullet,
        x: playerX + 20,
        y: 570
    });
}


/* ---------------- ENEMY ---------------- */

function createEnemy() {

    if (!gameRunning) return;

    const enemy = document.createElement("div");

    enemy.className = "enemy";

    const x = Math.random() * 365;

    enemy.style.left = x + "px";
    enemy.style.top = "-50px";

    game.appendChild(enemy);

    enemies.push({
        element: enemy,
        x: x,
        y: -50,
        speed: 2 + Math.random() * 2
    });
}


/* ---------------- COLLISION ---------------- */

function isColliding(a, b) {

    const rect1 = a.getBoundingClientRect();
    const rect2 = b.getBoundingClientRect();

    return (
        rect1.left < rect2.right &&
        rect1.right > rect2.left &&
        rect1.top < rect2.bottom &&
        rect1.bottom > rect2.top
    );
}


/* ---------------- GAME LOOP ---------------- */

function gameLoop() {

    if (!gameRunning) return;

    movePlayer();


    /* Bullets */

    bullets.forEach((bullet, bulletIndex) => {

        bullet.y -= 10;

        bullet.element.style.top =
            bullet.y + "px";

        if (bullet.y < -20) {

            bullet.element.remove();

            bullets.splice(bulletIndex, 1);

            return;
        }


        /* Bullet vs Enemy */

        enemies.forEach((enemy, enemyIndex) => {

            if (isColliding(
                bullet.element,
                enemy.element
            )) {

                bullet.element.remove();
                enemy.element.remove();

                bullets.splice(bulletIndex, 1);
                enemies.splice(enemyIndex, 1);

                score += 10;

                scoreElement.textContent = score;

                /* Chance of power-up */

                if (Math.random() < 0.12) {
                    createPower(enemy.x, enemy.y);
                }
            }

        });

    });


    /* Enemies */

    enemies.forEach((enemy, index) => {

        enemy.y += enemy.speed;

        enemy.element.style.top =
            enemy.y + "px";


        /* Enemy hits player */

        if (isColliding(
            player,
            enemy.element
        )) {

            enemy.element.remove();

            enemies.splice(index, 1);

            loseLife();

            return;
        }


        /* Enemy leaves screen */

        if (enemy.y > 680) {

            enemy.element.remove();

            enemies.splice(index, 1);

            loseLife();
        }

    });


    /* Power-ups */

    powers.forEach((power, index) => {

        power.y += 3;

        power.element.style.top =
            power.y + "px";

        if (isColliding(
            player,
            power.element
        )) {

            power.element.remove();

            powers.splice(index, 1);

            score += 25;

            scoreElement.textContent = score;

        }

        if (power.y > 680) {

            power.element.remove();

            powers.splice(index, 1);

        }

    });


    gameLoopTimer =
        requestAnimationFrame(gameLoop);
}


/* ---------------- LIFE ---------------- */

function loseLife() {

    lives--;

    livesElement.textContent = lives;

    if (lives <= 0) {
        endGame();
    }
}


/* ---------------- POWER UP ---------------- */

function createPower(x, y) {

    const power = document.createElement("div");

    power.className = "power";

    power.style.left = x + "px";
    power.style.top = y + "px";

    game.appendChild(power);

    powers.push({
        element: power,
        x: x,
        y: y
    });
}


/* ---------------- GAME OVER ---------------- */

function endGame() {

    gameRunning = false;

    clearInterval(enemyTimer);

    cancelAnimationFrame(gameLoopTimer);

    finalScore.textContent = score;

    document.getElementById("gameOver").style.display = "flex";

}


/* ---------------- RESTART ---------------- */

function restartGame() {

    enemies.forEach(e => e.element.remove());
    bullets.forEach(b => b.element.remove());
    powers.forEach(p => p.element.remove());

    enemies = [];
    bullets = [];
    powers = [];

    document.getElementById("gameOver").style.display = "none";

    startGame();
}

</script>

</body>
</html>
